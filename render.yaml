# =============================================================
#   RENDER BLUEPRINT  —  FARUEXEE Trade Bot  (free Web Service)
# =============================================================
#
#   Blueprints themselves are free. This one defines a free Web
#   Service, the same shape as your Discord alert bot.
#
#   Every secret is `sync: false` — Render prompts for those in the
#   dashboard and never reads them from this file. Nothing sensitive
#   belongs in this repo.
#
#   Deploy:  Render Dashboard -> New -> Blueprint -> pick this repo
#            (or "Connect a new Blueprint" if you are on the
#             Blueprints page — skip any "download generated
#             render.yaml" step, this file is the one you want)
#
#   ── What the free tier costs you ────────────────────────────
#
#   1. It sleeps after ~15 minutes without inbound HTTP traffic.
#      A sleeping bot manages nothing. Point an uptime pinger at
#      /health every 10 minutes. That endpoint also returns 503 if
#      the trading loop stalls, so the pinger doubles as a watchdog.
#
#   2. No persistent disk. trade_journal.csv is wiped on restart.
#      Mitigated: every position close is posted to Discord as a
#      full journal row, so the record survives in your channel.
#
#      The daily-loss stop is NOT affected — it reads today's
#      realised PnL from Bitget's position history, so a wiped
#      state file cannot silently disable it.
#
#   Open positions are never at risk from any of this: stops and
#   take-profits live on the exchange, and startup reconciles
#   against it.
#
#   To move to a worker with a real disk later, change type to
#   `worker`, set `plan: starter`, add a disk mounted at /var/data,
#   and set DATA_DIR=/var/data.
# =============================================================

services:
  - type: web
    name: faruexee-trade-bot
    runtime: python
    plan: free
    region: oregon                # same region as your alert bot
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: python faruexee_trade_bot.py
    healthCheckPath: /health
    autoDeploy: false             # never redeploy a live bot on a git push

    envVars:
      # ── Secrets — entered in the Render dashboard, never in git ──
      - key: BITGET_API_KEY
        sync: false
      - key: BITGET_API_SECRET
        sync: false
      - key: BITGET_PASSPHRASE
        sync: false
      - key: DISCORD_WEBHOOK
        sync: false

      # ── Master switches ──
      # Deploy with these OFF. Watch a dry run, then flip both in the
      # dashboard and restart. Do not commit them as true.
      - key: LIVE_TRADING
        value: "false"
      - key: DRY_RUN
        value: "true"

      # Free tier has no disk. The warning banner at startup is
      # expected — set this false once you have read it and accepted
      # the tradeoff above.
      - key: WARN_EPHEMERAL
        value: "true"

      # ── Scope ──
      - key: TRADE_SYMBOLS
        value: BTCUSDT,ETHUSDT,SOLUSDT,BNBUSDT,XRPUSDT,LINKUSDT,LTCUSDT,AVAXUSDT,ADAUSDT,SUIUSDT,NEARUSDT,XAUUSDT,XAGUSDT
      - key: TRADE_TIMEFRAMES
        value: 4H,1H
      - key: CHECK_INTERVAL
        value: "120"

      # ── Risk ──
      - key: RISK_PER_TRADE
        value: "0.02"
      - key: MAX_CONCURRENT
        value: "3"
      - key: MAX_PORTFOLIO_RISK
        value: "0.06"
      - key: MAX_DAILY_LOSS
        value: "0.06"
      - key: MIN_EQUITY_FRACTION
        value: "0.70"
      - key: MIN_EQUITY_USDT
        value: "20"
      - key: LEVERAGE
        value: "10"
      - key: MARGIN_MODE
        value: isolated
      - key: MAX_NOTIONAL_X_EQUITY
        value: "3.0"
      - key: MAX_MARGIN_FRACTION
        value: "0.30"
      - key: MAX_ENTRY_DISTANCE
        value: "0.05"

      # ── Order lifecycle ──
      - key: ORDER_FORCE
        value: gtc
      - key: ORDER_TTL_HOURS
        value: "48"
      - key: TP1_SPLIT
        value: "0.50"
      - key: TP2_SPLIT
        value: "0.30"
      - key: TP3_SPLIT
        value: "0.20"
      - key: MOVE_SL_TO_BE
        value: "true"
      - key: BE_OFFSET_R
        value: "0.05"
      - key: TRIGGER_TYPE
        value: mark_price

      # ── Strategy ──
      - key: LOOKBACK
        value: "20"
      - key: IMPULSE_STRENGTH
        value: "1.5"
      - key: TREND_STABILITY
        value: "2"
      - key: VOLUME_MULT
        value: "1.5"
      - key: REQUIRE_VOLUME
        value: "true"
      - key: USE_BASE_CANDLE
        value: "true"
      - key: USE_ATR_SL
        value: "true"
      - key: ATR_LEN
        value: "14"
      - key: ATR_MULT
        value: "0.5"
      - key: MIN_RR
        value: "1.5"
      - key: TP_MULTI
        value: "2.0"
      - key: ZONE_MAX_AGE
        value: "300"
      - key: BREACH_BUF_MULT
        value: "0.1"
      - key: FVG_RECENT_BARS
        value: "100"

      # Keep this on "ema". "structure" cannot resolve on the daily —
      # Bitget serves only 90 daily candles — and would block every 4H
      # entry permanently.
      - key: REQUIRE_HTF
        value: "true"
      - key: HTF_BIAS_MODE
        value: ema
      - key: HTF_EMA_LEN
        value: "50"
      - key: HTF_FLAT_BLOCKS
        value: "false"

      - key: PYTHON_VERSION
        value: "3.12.7"
