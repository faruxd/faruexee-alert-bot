# =============================================================================
#  cf_bot -- configuration
#
#  Validated by pydantic on startup. Unknown keys are a FATAL ERROR, not a
#  warning: a typo'd key must not look like it took effect.
#
#  Credentials do NOT belong in this file. They are read from the environment
#  only. See .env.example.
# =============================================================================

exchange:
  # Symbols scanned each loop, in priority order. The bot holds at most ONE
  # position across ALL of them (see guards.MAX_CONCURRENT_POSITIONS), so this
  # list widens the search for a signal -- it does not multiply risk.
  # Selected by 24h quote volume on Bitget, crypto only.
  #
  # DELIBERATELY EXCLUDED: Bitget's highest-volume perps after BTC/ETH are
  # tokenized equities and commodities -- SNDK, MU, NVDA, SKHYNIX, SAMSUNG,
  # INTC, MRVL, CRCL, XAU, XAG, CL -- plus leveraged ETFs like SOXL/SOXS/KORU.
  # They only move during traditional market hours and they GAP overnight and
  # over weekends. A 0.2% stop cannot survive a 3% gap, and an EMA cross on an
  # instrument that is closed two thirds of the day is noise. Crypto only.
  # BTC only.
  #
  # Twenty correlated crypto pairs all cross at the same moment when the whole
  # market moves, so the bot fired three entries inside ten minutes -- one
  # directional bet taken three times, all stopped out together. A single symbol
  # removes that failure mode outright: one signal source, and the max-1-position
  # rule then genuinely means one bet.
  #
  # It also means far fewer signals, so the 3-entries-per-day cap will rarely
  # bind and entries stop being decided by whatever happened to fire first
  # after 00:00 UTC.
  symbols:
    - "BTC/USDT:USDT"

  # Fixed at 5m. The strategy's bar counts (ATR 14, 30d percentile, 3-bar entry
  # validity, 12-bar time stop) are all defined against 5m bars.
  timeframe: "5m"
  product_type: "USDT-FUTURES"
  margin_coin: "USDT"

risk:
  # PERCENT of equity risked per trade. 1.0 means 1%.
  #
  # Same unit as MAX_RISK_PCT in cf_bot/constants.py, which hard-caps this at
  # 1.0 and is not configurable. Startup raises if this exceeds the cap.
  risk_pct: 1.0

strategy:
  # Which strategy runs: "ema_scalper" or "forced_flow".
  name: "ema_scalper"

  # --- ema_scalper -----------------------------------------------------------
  # 15m EMA(ema_trend) sets direction; a 5m EMA(fast)/EMA(slow) cross in that
  # direction triggers the entry.
  ema_fast: 9
  ema_slow: 21
  ema_trend: 50

  # Stop distance in ATR(14) units on the 5m.
  #
  # DO NOT tighten this without doing the fee arithmetic. Position size is
  # equity*risk / stop_distance, and fees are charged on notional, so halving
  # the stop doubles the notional AND doubles the fee cost per unit of risk.
  # At 1.5x ATR (~0.5% on BTC 5m) a taker round trip costs roughly 0.25R.
  # At 0.5x ATR it costs roughly 0.75R, which no realistic edge survives.
  atr_mult: 1.5

  # Target as a multiple of risk. A 2R target keeps the fee drag a smaller
  # fraction of each winner.
  target_r: 2.0

  # --- forced_flow (unused while name is ema_scalper) ------------------------
  k: 2.5     # displacement threshold, in ATR units
  s: 1.25    # stop distance, in ATR units
  p: 30      # ATR percentile floor

runtime:
  # At ONE symbol a loop costs ~6 requests (reconcile is a few account calls
  # plus 2 per symbol) and candles only refetch when a bar has actually closed.
  # That is ~0.4/sec against the 4/sec limiter -- plenty of headroom, so the
  # interval can be tight again.
  #
  # If you add symbols back, raise this: the budget is roughly 2 requests per
  # symbol per loop, and the limiter throttles silently once it is exceeded.
  loop_interval_seconds: 15.0
  heartbeat_seconds: 300.0
  kill_file: "KILL"

  # Scalper only: how long the entry rests passively before falling back to a
  # market order. Longer means more maker fills (0.020%) and fewer taker fills
  # (0.060%), at the cost of missing more moves. The loop is blocked for this
  # long during an entry.
  entry_limit_timeout_seconds: 25.0

logging:
  level: "INFO"
  file: "logs/cf_bot.jsonl"
  max_bytes: 50000000
  backup_count: 5
