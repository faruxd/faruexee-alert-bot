# =============================================================================
#  cf_bot -- configuration
#
#  Validated by pydantic on startup. Unknown keys are a FATAL ERROR, not a
#  warning: a typo'd key must not look like it took effect.
#
#  Credentials do NOT belong in this file. They are read from the environment
#  only. See .env.example.
# =============================================================================

exchange:
  # BTC ONLY.
  #
  # Twenty correlated crypto pairs all cross at the same moment when the whole
  # market moves, so the bot fired three entries inside ten minutes -- one
  # directional bet taken three times, all stopped out together. A single symbol
  # removes that failure mode: one signal source, and the max-1-position rule
  # then genuinely means one bet.
  #
  # It also means far fewer signals, so the 3-per-day cap rarely binds and
  # entries stop being decided by whichever pair happened to fire first after
  # 00:00 UTC.
  symbols:
    - "BTC/USDT:USDT"

  # Signal timeframe: the EMA fast/slow cross is evaluated on closed bars of
  # this size. Raised from 5m.
  #
  # Measured on a year of BTC: at 5m the round-trip fee costs 0.56R before the
  # market moves; at 15m it is 0.29R. Profit factor went 0.17 -> 0.48 on that
  # change alone. It does NOT make the strategy profitable -- gross P&L is still
  # negative -- it loses more slowly.
  timeframe: "15m"

  # Trend timeframe: the higher-timeframe EMA(ema_trend) that sets direction.
  # Must be a whole multiple of `timeframe`, or the two series do not share bar
  # boundaries and the filter reads a partly formed candle.
  #
  # The 2x vs 4x ratio measured as noise (PF 0.48 / 0.41 / 0.45 at 2x / 3x / 4x).
  # The signal timeframe does the work here, not the ratio.
  trend_timeframe: "30m"

  product_type: "USDT-FUTURES"
  margin_coin: "USDT"

risk:
  # PERCENT of equity risked per trade. 1.0 means 1%.
  #
  # Same unit as MAX_RISK_PCT in cf_bot/constants.py, which hard-caps this at
  # 1.0 and is not configurable. Startup raises if this exceeds the cap.
  risk_pct: 1.0

strategy:
  # Which strategy runs: "ema_scalper" or "forced_flow".
  name: "ema_scalper"

  # --- ema_scalper -----------------------------------------------------------
  # EMA(ema_trend) on the TREND timeframe sets direction; an
  # EMA(fast)/EMA(slow) cross on the SIGNAL timeframe, in that direction,
  # triggers the entry.
  ema_fast: 9
  ema_slow: 21
  ema_trend: 50

  # Stop distance in ATR(14) units, measured on the signal timeframe.
  #
  # DO NOT tighten this without redoing the fee arithmetic. Position size is
  # equity*risk / stop_distance and fees are charged on notional, so halving the
  # stop doubles the notional AND doubles the fee cost per unit of risk.
  atr_mult: 1.5

  # Target as a multiple of risk. A 2R target keeps fee drag a smaller fraction
  # of each winner.
  target_r: 2.0

  # --- forced_flow (unused while name is ema_scalper) ------------------------
  k: 2.5     # displacement threshold, in ATR units
  s: 1.25    # stop distance, in ATR units
  p: 30      # ATR percentile floor

runtime:
  # At ONE symbol a loop costs ~6 requests: a few account calls plus 2 per
  # symbol. Candles only refetch once a bar has actually closed, so they cost
  # almost nothing. That is well under the 4/sec limiter in orders.py.
  #
  # If you add symbols back, raise this. The budget is roughly 2 requests per
  # symbol per loop and the limiter throttles silently once it is exceeded.
  loop_interval_seconds: 15.0
  heartbeat_seconds: 300.0
  kill_file: "KILL"

  # Scalper only: how long the entry rests passively before falling back to a
  # market order. Longer means more maker fills (0.020%) and fewer taker fills
  # (0.060%), at the cost of missing more moves. The loop is blocked for this
  # long during an entry.
  entry_limit_timeout_seconds: 25.0

logging:
  level: "INFO"
  file: "logs/cf_bot.jsonl"
  max_bytes: 50000000
  backup_count: 5
